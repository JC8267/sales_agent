[project]
name = "store-agent"
version = "0.1.0"
description = "Store employee AI agent: routing, semantic-layer tools, validation, and automations (vertical-slice spike)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
store-agent = "store_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/store_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
